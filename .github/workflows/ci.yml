name: NBA Analytics CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run Pytest
        env:
          GCP_PROJECT_ID: "ci-test-project"
          STAGING_DATASET: "ci_test_dataset"
        run: uv run pytest test/ -v

  deploy:
    name: Deploy to Azure VM
    needs: test # Strictly ensures deployment only happens if unit tests pass
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Prevents PRs from deploying
    
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            # Navigate to your project directory on the VM
            cd ~/NBA-Analytics-Pipeline
            
            # Pull the latest changes from the main branch
            git pull origin main
            
            # Restart the scheduler and worker so Cosmos registers the new dbt files
            sudo docker compose restart airflow-scheduler airflow-worker
            
